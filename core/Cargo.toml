[package]
name = "vault-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Sin `password-hash`: no se usa la cadena PHC, los parámetros se guardan por separado.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
getrandom = "0.4"
# Búsqueda principal por subsecuencia ("gm" encuentra "Gmail"). MPL-2.0.
nucleo-matcher = "0.3.1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
# `bundled` compila SQLite desde C; en Android requiere el NDK.
rusqlite = { version = "0.41", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", default-features = false, features = ["derive"] }
# Respaldo de la búsqueda: distancia OSA para errores de escritura.
strsim = "0.11.1"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
