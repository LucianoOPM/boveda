[package]
name = "vault-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Sin `password-hash`: no se usa la cadena PHC, los parámetros se guardan por separado.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
getrandom = "0.4"
secrecy = "0.10"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }
