[package]
name = "vault-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Sin `password-hash`: no se usa la cadena PHC, los parámetros se guardan por separado.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
# No se usa directamente: está solo para activar `zeroize` en blake2, digest y
# block-buffer por unificación de features (#54). `argon2` mete la contraseña
# maestra en un `Blake2b512` y, sin la feature, el búfer de bloque y el estado
# del hasher se sueltan sin borrar (`blake2/zeroize` activa `digest/zeroize` y
# `block-buffer/zeroize`). Misma versión que resuelve `argon2` (0.6.0): al
# actualizar `argon2`, comprobar que sigue siendo la misma. Sin crates nuevos en
# Cargo.lock. (MIT OR Apache-2.0)
blake2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
getrandom = "0.4"
# Búsqueda principal por subsecuencia ("gm" encuentra "Gmail"). MPL-2.0.
nucleo-matcher = "0.3.1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
# `bundled` compila SQLite desde C; en Android requiere el NDK.
rusqlite = { version = "0.41", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", default-features = false, features = ["derive"] }
# Emparejamiento y canal Noise (#95). Sin `std`: en 0.10.0 esa feature activa
# también `ring`, `sha2` y `blake2/std`. Solo entran curve25519-dalek 4,
# chacha20poly1305 0.10, blake2 0.10 y getrandom 0.3 (versiones duplicadas con
# las del núcleo: `deny.toml` solo avisa). `snow` no depende de `zeroize` y no
# borra sus secretos (excepción documentada en ARCHITECTURE.md). (Apache-2.0 OR MIT)
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }
# Respaldo de la búsqueda: distancia OSA para errores de escritura.
strsim = "0.11.1"
thiserror = "2"
# Normaliza a NFC la contraseña maestra antes de derivar la llave (#57).
# Versión exacta: cambia los bytes que recibe Argon2id. (MIT OR Apache-2.0) AND Unicode-3.0.
unicode-normalization = "=0.1.26"
# Deriva la llave pública X25519 desde los 32 bytes de la llave privada (#94).
# `static_secrets` da `StaticSecret::from([u8; 32])`; `zeroize` la borra al
# soltarla. Sin `precomputed-tables` (se deriva una vez por emparejamiento).
# (BSD-3-Clause)
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
