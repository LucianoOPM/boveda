# Toolchain compartido por el núcleo y las dos apps.
# La versión está fijada para que la CI y la PC compilen igual. Subirla es un
# commit propio que cambia este archivo (ver CLAUDE.md de la raíz).
# Sin targets de Android: cargokit compila la app con el toolchain `stable`,
# no con este archivo, y les instala sus targets por su cuenta. Listarlos aquí
# solo haría que rustup los descargara para 1.99.1 sin que nadie los use. La
# #48 decide si vuelven cuando la librería de Android use este toolchain.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
