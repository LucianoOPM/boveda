# Toolchain compartido por el núcleo y las dos apps.
# La versión está fijada para que la CI y la PC compilen igual. Subirla es un
# commit propio que cambia este archivo y mobile/rust/rust-toolchain.toml, que
# lleva el mismo canal y los mismos componentes (ver CLAUDE.md de la raíz).
# Sin targets de Android: la librería de la app la compila el build hook con
# mobile/rust/rust-toolchain.toml, que es el que lista sus targets.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
