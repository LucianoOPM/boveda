[package]
name = "rust_lib_boveda"
version = "0.1.0"
description = "Puente entre la app Flutter y vault-core: solo convierte tipos y delega"
# Edición 2021 a propósito: flutter_rust_bridge genera y formatea frb_generated.rs
# con el estilo de 2021, y con 2024 `cargo fmt --check` fallaría tras cada regeneración.
edition = "2021"
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# La versión debe coincidir con la de flutter_rust_bridge en pubspec.yaml.
flutter_rust_bridge = "=2.13.0"
# Mismas versiones que en vault-core: la fachada solo envuelve en SecretString
# lo que recibe de Dart y borra el original.
secrecy = "0.10"
vault-core = { path = "../../core" }
zeroize = "1.9"

[dev-dependencies]
# Misma versión y características que vault-core: solo para alterar, en las
# pruebas, la copia de la bóveda de ejemplo.
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
