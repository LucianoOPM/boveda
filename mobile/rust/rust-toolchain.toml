# Toolchain con el que se compila la librería de Android (#48).
#
# El build hook (`hook/build.dart`, de native_toolchain_rust) lee ESTE archivo y
# no el de la raíz: exige un `channel` fijo y la lista de `targets`. Los dos
# archivos deben tener el mismo `channel` y los mismos `components`; la CI lo
# comprueba. Subir Rust es un commit propio que cambia los dos.
#
# Los targets son las ABI que Flutter empaqueta (`abiFilters` de Flutter:
# armeabi-v7a, arm64-v8a y x86_64).
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
]
