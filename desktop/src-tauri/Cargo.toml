[package]
name = "boveda-desktop"
version = "0.1.0"
description = "App de bandeja de Windows de Bóveda"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boveda_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
# Aviso «Contraseña lista para pegar» (#98). Solo se usa su API de Rust.
tauri-plugin-notification = "2.8.1"
# Escribe en el portapapeles excluido del historial de Win+V y de la nube (#98).
# Sin `image-data`: no hace falta la crate `image`.
arboard = { version = "3.7.0", default-features = false }
secrecy = "0.10"
zeroize = "1.9"

# Borrado condicional del portapapeles bajo una sola apertura (#98). Es la misma
# crate que `arboard` usa en Windows, así que no agrega otra versión.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
# Ventana de solo mensajes que hace de propietaria del portapapeles: con un
# propietario NULL Windows no lo bloquea (#98). Misma versión que ya está en el
# lock (la usa tauri); solo las funciones de ventanas.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# El perfil de release vive en el Cargo.toml de la raíz: Cargo ignora los
# perfiles declarados en los miembros del workspace.
