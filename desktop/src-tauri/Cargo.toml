[package]
name = "boveda-desktop"
version = "0.1.0"
description = "App de bandeja de Windows de Bóveda"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "boveda_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
# Aviso «Contraseña lista para pegar» (#98). Solo se usa su API de Rust.
tauri-plugin-notification = "2.8.1"
# Escribe en el portapapeles excluido del historial de Win+V y de la nube (#98).
# Sin `image-data`: no hace falta la crate `image`.
arboard = { version = "3.7.0", default-features = false }
secrecy = "0.10"
zeroize = "1.9"
# Núcleo compartido: `KeyPair` de la identidad de la PC (#99).
vault-core = { path = "../../core" }
# Serialización de la lista de celulares emparejados (#99). Mismas versiones y
# features que `core/`; no son criptografía ni red y no suman crates al lock.
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Borrado condicional del portapapeles bajo una sola apertura (#98). Es la misma
# crate que `arboard` usa en Windows, así que no agrega otra versión.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
# Anuncio mDNS de la PC en las redes privadas (#100). Aprobada en el épico.
mdns-sd = "0.22"
# Ventana de solo mensajes que hace de propietaria del portapapeles: con un
# propietario NULL Windows no lo bloquea (#98). Misma versión que ya está en el
# lock (la usa tauri); solo las funciones de ventanas.
# Para #99 se suman DPAPI (`Win32_Security_Cryptography`) y el reemplazo atómico
# de archivos (`Win32_Storage_FileSystem`); siguen sin crates nuevos.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Carpetas temporales de las pruebas de la identidad y la lista (#99).
tempfile = "3"

# El perfil de release vive en el Cargo.toml de la raíz: Cargo ignora los
# perfiles declarados en los miembros del workspace.
