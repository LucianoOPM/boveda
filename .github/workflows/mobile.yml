name: Mobile

# Filtro de rutas: el job solo corre cuando cambia algo que afecta a la app.
# Si algún día se protege dev y este job se vuelve obligatorio, hay que quitar
# el filtro: un workflow que no se dispara deja el check pendiente para siempre
# y bloquea el merge.
on:
  push:
    branches: [main, dev]
    paths:
      - "mobile/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/mobile.yml"

# Grupo propio: no cancela ni lo cancela una ejecución de ci.yml.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mobile:
    # Imagen fija: un cambio de ubuntu-latest no altera el entorno sin un commit.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        # 17 es el mínimo de AGP 9.1 y coincide con sourceCompatibility y
        # jvmTarget de android/app/build.gradle.kts.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Mismos canal y componentes en los dos rust-toolchain.toml
        # El build hook que compila la librería de Android (hook/build.dart)
        # lee mobile/rust/rust-toolchain.toml, y el resto del repositorio usa el
        # de la raíz (#48). Deben fijar el mismo canal y los mismos componentes:
        # subir Rust es un commit que cambia los dos archivos.
        shell: bash
        run: |
          # El canal se lee hasta la comilla de cierre: un comentario al final
          # de la línea no cuenta.
          channel() { sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$1"; }
          components() {
            sed -n 's/^components *= *\[\(.*\)\].*/\1/p' "$1" | tr -d ' "' | tr ',' '\n' | sort | paste -sd,
          }
          root=../rust-toolchain.toml
          app=rust/rust-toolchain.toml
          # Si un archivo lleva `components` pero no se pudo leer (por ejemplo,
          # un arreglo en varias líneas), dos listas vacías serían "iguales":
          # se rechaza en vez de aprobar sin comparar.
          for f in "$root" "$app"; do
            if grep -q '^components' "$f" && [ -z "$(components "$f")" ]; then
              echo "::error::No se pudieron leer los componentes de $f (van en una sola línea: components = [\"rustfmt\", \"clippy\"])."
              exit 1
            fi
          done
          root_channel=$(channel "$root"); app_channel=$(channel "$app")
          root_components=$(components "$root"); app_components=$(components "$app")
          echo "raíz:        canal $root_channel, componentes [$root_components]"
          echo "mobile/rust: canal $app_channel, componentes [$app_components]"
          if [ -z "$root_channel" ] || [ -z "$app_channel" ]; then
            echo "::error::No se pudo leer el canal de $root o de mobile/$app (el canal va en una línea: channel = \"x.y.z\")."
            exit 1
          fi
          if [ "$root_channel" != "$app_channel" ]; then
            echo "::error::El canal de rust-toolchain.toml ($root_channel) y el de mobile/$app ($app_channel) deben ser iguales. Subir Rust cambia los dos archivos en un commit propio."
            exit 1
          fi
          if [ "$root_components" != "$app_components" ]; then
            echo "::error::Los componentes de rust-toolchain.toml [$root_components] y los de mobile/$app [$app_components] deben ser iguales."
            exit 1
          fi

      - name: Toolchain de rust-toolchain.toml
        # Igual que en ci.yml: rustup instala la versión y los componentes del
        # archivo. Lo usan los pasos que corren cargo dentro del repo (codegen
        # y cargo expand). La librería de Android la compila el build hook con
        # mobile/rust/rust-toolchain.toml (mismo canal, ver el paso anterior),
        # y rustup instala ahí sus targets de Android.
        shell: bash
        run: |
          rustup toolchain install
          rustc --version

      - name: Caché de Rust
        # El build hook compila la librería de Android dentro de
        # mobile/.dart_tool, que rust-cache no guarda: solo se cachea target/ de
        # la raíz y el registro de cargo.
        uses: Swatinem/rust-cache@v2

      - name: Flutter
        # El :hash: de subosito es el commit de Flutter, no el lock: la clave
        # de pub incluye pubspec.lock para que la caché cambie con él.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('mobile/pubspec.lock') }}"

      - name: Gradle
        # Caché sobre actions/cache. Solo se guarda en pushes a dev (la rama
        # por defecto); en las demás ramas solo se lee.
        # NDK: no se instala aparte. Sale de flutter.ndkVersion en
        # android/app/build.gradle.kts; Flutter 3.47.9 lo resuelve como
        # 28.2.13676358 y Gradle lo descarga si la imagen no lo trae.
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Instalar flutter_rust_bridge_codegen
        # Debe coincidir con flutter_rust_bridge en mobile/pubspec.yaml y en
        # mobile/rust/Cargo.toml; si se actualiza, se cambian los tres en el
        # mismo commit. rust-cache guarda ~/.cargo/bin: con caché, no recompila.
        # Toolchain: el de rust-toolchain.toml (corre dentro del repo).
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Instalar cargo-expand
        # El codegen 2.13.0 ejecuta cargo expand y, si falta, lo instala sin
        # versión; por eso se fija aquí. Si se actualiza el codegen, se revisa
        # también esta versión. Toolchain: el de rust-toolchain.toml.
        run: cargo install cargo-expand --version 1.0.127 --locked

      - name: Versiones del codegen y de cargo-expand
        run: |
          flutter_rust_bridge_codegen --version
          cargo expand --version

      - name: Dependencias de Dart
        run: flutter pub get

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Regenerar el puente
        # Toolchain: el de rust-toolchain.toml (el codegen llama a cargo expand
        # dentro de mobile/rust).
        run: flutter_rust_bridge_codegen generate

      - name: Código generado al día
        # git diff no ve archivos nuevos sin seguimiento (p. ej. un archivo
        # nuevo en rust/src/api/ genera un .dart nuevo): git status sí.
        shell: bash
        run: |
          generated=(lib/src/rust/ rust/src/frb_generated.rs)
          git diff --exit-code -- "${generated[@]}"
          untracked=$(git status --porcelain -- "${generated[@]}")
          if [ -n "$untracked" ]; then
            echo "Código generado desactualizado; ejecuta flutter_rust_bridge_codegen generate:"
            echo "$untracked"
            exit 1
          fi

      - name: APK debug
        # Toolchain: el de mobile/rust/rust-toolchain.toml, con el que el build
        # hook (hook/build.dart) compila la librería de Rust. Los hooks compilan
        # siempre en release, también en un build de depuración.
        # Las 3 ABI que Flutter empaqueta (armeabi-v7a, arm64-v8a y x86_64),
        # las mismas que lista rust/rust-toolchain.toml.
        run: flutter build apk --debug --target-platform android-arm,android-arm64,android-x64

      - name: El APK trae la librería de Rust de las 3 ABI, compilada con el Rust fijado
        # Falla si el hook no corrió o si falta la librería de alguna ABI. El
        # compilador deja su versión en la sección .comment de la librería: si
        # el hook usara otro toolchain, esto también lo detecta (#48).
        shell: bash
        run: |
          pinned=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' ../rust-toolchain.toml)
          apk=build/app/outputs/flutter-apk/app-debug.apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            lib="lib/$abi/librust_lib_boveda.so"
            if ! unzip -l "$apk" "$lib" > /dev/null 2>&1; then
              echo "::error::El APK no trae $lib: el build hook no compiló la librería de $abi."
              exit 1
            fi
            unzip -p "$apk" "$lib" > "$RUNNER_TEMP/$abi.so"
            found=$(strings -a "$RUNNER_TEMP/$abi.so" | grep -m1 '^rustc version ' || true)
            echo "$abi: $found (fijado: $pinned)"
            case "$found" in
              "")
                echo "::error::No se encontró la cadena 'rustc version' en la librería de $abi: puede que el empaquetado haya quitado la sección .comment, no que el Rust sea otro."
                exit 1 ;;
              "rustc version $pinned "*) ;;
              *) echo "::error::La librería de $abi no se compiló con Rust $pinned."; exit 1 ;;
            esac
          done
