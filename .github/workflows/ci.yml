name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Un push nuevo a la misma rama o PR cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Rust: cada job instala la versión fijada en rust-toolchain.toml con
# `rustup toolchain install` sin argumentos (rustup >= 1.28), sin una acción
# aparte que repita la versión. rustup instala además los targets de Android
# que lista el archivo, también en Windows y en los jobs que no los usan: se
# aceptan unos segundos de descarga porque omitirlos exigiría pasar por encima
# del archivo con RUSTUP_TOOLCHAIN y repetir aquí la versión y los componentes.

jobs:
  core:
    # Ciclo rápido para el TDD del núcleo: solo vault-core, sin compilar Tauri.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain de rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy -p vault-core --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test -p vault-core

  rust:
    # Windows porque la app de escritorio (DPAPI, portapapeles) solo compila ahí.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain de rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test --workspace

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain de rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check
