# Reglas de cargo deny para todo el workspace.

[graph]
all-features = true
# Solo las plataformas que compilamos: escritorio en Windows y app en Android.
# Las dependencias exclusivas de otras plataformas (gtk, zbus...) no se revisan.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]

[advisories]
# Cualquier vulnerabilidad rompe la revisión. Un crate sin mantenimiento solo
# la rompe si es dependencia directa nuestra; los transitivos (p. ej. los
# `unic-*` que trae Tauri) quedan como advertencia porque no los controlamos.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]

[licenses.private]
# Los crates propios no se publican y no declaran licencia.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Las dependencias por ruta entre crates del workspace no llevan versión.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
