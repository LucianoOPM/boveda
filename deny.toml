# Reglas de cargo deny para todo el workspace.

[graph]
all-features = true

[advisories]
# Cualquier vulnerabilidad o crate sin mantenimiento conocido rompe la revisión.
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Los crates propios no se publican y no declaran licencia.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Las dependencias por ruta entre crates del workspace no llevan versión.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
